<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐 · 星辰之约</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: radial-gradient(ellipse at 50% 40%, #0a1845 0%, #050a2e 45%, #020516 100%);
  user-select: none;
  cursor: pointer;
}

/* ========== 星空背景 ========== */
#starfield {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.bg-star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  animation: twinkle ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.15; transform: scale(0.8); }
  50% { opacity: 0.9; transform: scale(1.3); }
}

/* 飘浮星尘 */
.nebula {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
  pointer-events: none;
  animation: nebulaDrift 20s ease-in-out infinite;
}

@keyframes nebulaDrift {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(30px, -20px); }
}

/* ========== 倒计时 ========== */
#countdown-screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.count-number {
  font-size: 180px;
  font-weight: 900;
  color: #aac4ff;
  text-shadow: 0 0 60px rgba(100,160,255,0.9), 0 0 120px rgba(80,120,255,0.5);
  animation: countPop 1s ease-out forwards;
}

@keyframes countPop {
  0% { transform: scale(0.3); opacity: 0; }
  20% { transform: scale(1.3); opacity: 1; }
  80% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.5); opacity: 0; }
}

.count-hint {
  position: absolute;
  bottom: 15%;
  font-size: 22px;
  color: rgba(170,196,255,0.7);
  letter-spacing: 6px;
  animation: fadeIn 0.5s ease forwards;
  animation-delay: 0.3s;
  opacity: 0;
}

@keyframes fadeIn { to { opacity: 1; } }

/* ========== 蛋糕场景 ========== */
#cake-scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1.2s ease;
  z-index: 50;
}

#cake-scene.show { opacity: 1; }

.cake-container {
  position: relative;
  transform: scale(0);
}

#cake-scene.show .cake-container {
  animation: cakeAppear 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes cakeAppear {
  0% { transform: scale(0) translateY(100px); opacity: 0; }
  50% { transform: scale(1.1) translateY(-5px); opacity: 1; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

/* ========== 水晶球罩 ========== */
.crystal-dome {
  position: absolute;
  top: -40px;
  left: 50%;
  transform: translateX(-50%);
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(100,160,255,0.08), rgba(30,60,150,0.04) 60%, transparent 80%);
  border: 1px solid rgba(100,160,255,0.15);
  box-shadow: inset 0 0 60px rgba(80,140,255,0.1), 0 0 80px rgba(60,100,200,0.15);
  pointer-events: none;
  overflow: hidden;
}

/* 水晶球内漂浮星点 */
.dome-star {
  position: absolute;
  background: #aac4ff;
  border-radius: 50%;
  animation: domeFloat ease-in-out infinite;
}

@keyframes domeFloat {
  0%, 100% { transform: translate(0, 0); opacity: 0.3; }
  50% { transform: translate(10px, -15px); opacity: 0.9; }
}

/* 水晶球高光 */
.dome-highlight {
  position: absolute;
  top: 10%;
  left: 15%;
  width: 60px;
  height: 30px;
  background: radial-gradient(ellipse, rgba(255,255,255,0.15), transparent 70%);
  border-radius: 50%;
  transform: rotate(-30deg);
}

/* ========== 蛋糕主体 ========== */
.cake {
  position: relative;
  width: 260px;
  margin: 0 auto;
  margin-top: 40px;
}

/* 蜡烛区——单根 */
.candles-box {
  display: flex;
  justify-content: center;
  margin-bottom: -30px;
  position: relative;
  z-index: 20;
}

.candle {
  width: 14px;
  height: 60px;
  border-radius: 4px 4px 2px 2px;
  position: relative;
  background: linear-gradient(to bottom, #c8d8ff 40%, #6b8fd6 100%);
  box-shadow: inset -3px 0 4px rgba(0,0,0,0.2), 0 0 12px rgba(100,160,255,0.3);
}

.candle::before {
  content: '';
  display: block;
  width: 2px;
  height: 10px;
  background: #4466aa;
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
}

/* 火焰——蓝白色系 */
.flame {
  position: absolute;
  top: -32px;
  left: 50%;
  width: 18px;
  height: 30px;
  background: radial-gradient(ellipse at center bottom, #ffffff 5%, #a8d4ff 35%, #4a90ff 70%, #1a5fee 100%);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  transform: translateX(-50%) rotate(-3deg);
  opacity: 0;
  box-shadow: 0 0 20px rgba(80,160,255,0.8), 0 0 50px rgba(60,120,255,0.5), 0 0 80px rgba(40,80,200,0.3);
  z-index: 25;
}

.flame.lit {
  animation: flicker 0.15s infinite alternate;
}

@keyframes flicker {
  0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 1; }
  100% { transform: translateX(-50%) scale(1.1, 1.18) rotate(3deg); opacity: 0.92; }
}

.flame.out {
  animation: blowOut 0.5s ease-in forwards;
}

@keyframes blowOut {
  0% { transform: translateX(-50%) scale(1); opacity: 1; }
  40% { transform: translateX(-50%) scale(0.8, 0.3) translateY(5px); }
  100% { transform: translateX(-50%) scale(0) translateY(12px); opacity: 0; }
}

/* 烟雾 */
.smoke {
  position: absolute;
  top: -35px;
  left: 50%;
  width: 8px;
  height: 8px;
  background: rgba(150,180,230,0.4);
  border-radius: 50%;
  opacity: 0;
  transform: translateX(-50%);
}

.smoke.rise {
  animation: smokeRise 1.8s ease-out forwards;
}

@keyframes smokeRise {
  0% { opacity: 0.5; transform: translateX(-50%) translateY(0) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-50px) scale(3.5); }
}

/* 蛋糕层次——深蓝玄幻 */
.cake-tier {
  margin: 0 auto;
  position: relative;
  border-radius: 6px;
}

/* 顶层——最小 */
.tier-3 {
  width: 130px;
  height: 48px;
  background: linear-gradient(to bottom, #1a2e6e 0%, #0d1a4a 60%, #08123a 100%);
  z-index: 21;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(60,100,200,0.15);
}

/* 中层 */
.tier-2 {
  width: 175px;
  height: 58px;
  background: linear-gradient(to bottom, #15266a 0%, #0a1640 60%, #050e30 100%);
  margin-top: -2px;
  z-index: 2;
  box-shadow: 0 6px 24px rgba(0,0,0,0.5), inset 0 0 25px rgba(50,90,180,0.12);
}

/* 底层——最大 */
.tier-1 {
  width: 220px;
  height: 70px;
  background: linear-gradient(to bottom, #10205c 0%, #08113e 55%, #030920 100%);
  margin-top: -2px;
  z-index: 3;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6), inset 0 0 30px rgba(40,80,170,0.1);
}

/* 蛋糕侧面星点装饰 */
.cake-tier::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background-image:
    radial-gradient(circle at 15% 35%, #aac4ff 0.8px, transparent 1.2px),
    radial-gradient(circle at 35% 65%, #7faaff 0.6px, transparent 1px),
    radial-gradient(circle at 55% 25%, #ffffff 0.7px, transparent 1.1px),
    radial-gradient(circle at 75% 55%, #aac4ff 0.5px, transparent 0.9px),
    radial-gradient(circle at 85% 40%, #5e9eff 0.6px, transparent 1px),
    radial-gradient(circle at 25% 80%, #ffffff 0.5px, transparent 0.8px),
    radial-gradient(circle at 65% 85%, #7faaff 0.6px, transparent 1px),
    radial-gradient(circle at 45% 15%, #c8d8ff 0.5px, transparent 0.8px);
  pointer-events: none;
  opacity: 0.8;
}

/* 顶面奶油——星空晕染 */
.frosting {
  position: absolute;
  top: -8px;
  left: 0;
  right: 0;
  height: 16px;
  display: flex;
  justify-content: space-around;
  pointer-events: none;
}

.frosting span {
  flex: 1;
  height: 16px;
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
}

.tier-1 .frosting span {
  background: linear-gradient(to bottom, rgba(100,160,255,0.5), rgba(60,100,200,0.3));
  box-shadow: 0 0 8px rgba(80,140,255,0.2);
}
.tier-2 .frosting span {
  background: linear-gradient(to bottom, rgba(120,170,255,0.45), rgba(70,110,210,0.25));
  box-shadow: 0 0 8px rgba(90,150,255,0.2);
}
.tier-3 .frosting span {
  background: linear-gradient(to bottom, rgba(140,190,255,0.5), rgba(80,120,220,0.3));
  box-shadow: 0 0 8px rgba(100,160,255,0.25);
}

/* 五角星装饰 */
.cake-star {
  position: absolute;
  font-size: 12px;
  color: #ffd966;
  text-shadow: 0 0 8px rgba(255,217,102,0.6);
  pointer-events: none;
  z-index: 5;
}

/* 蛋糕细闪光点 */
.cake-sparkle {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 4px rgba(180,210,255,0.9), 0 0 8px rgba(120,170,255,0.6);
  pointer-events: none;
  z-index: 6;
  opacity: 0;
  animation: sparkleTwinkle ease-in-out infinite;
}

@keyframes sparkleTwinkle {
  0%, 100% { opacity: 0; transform: scale(0.4); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* 蛋糕底盘——星空托盘 */
.plate {
  width: 290px;
  height: 20px;
  margin: 4px auto 0;
  background: linear-gradient(to bottom, #2a3e7a, #15255a);
  border-radius: 50%;
  box-shadow: 0 10px 40px rgba(0,0,20,0.6), 0 0 30px rgba(60,100,200,0.2);
  position: relative;
  z-index: -1;
}

.plate::after {
  content: '';
  position: absolute;
  inset: 2px 10px;
  border-radius: 50%;
  background-image:
    radial-gradient(circle at 20% 50%, #aac4ff 0.5px, transparent 0.8px),
    radial-gradient(circle at 50% 30%, #ffffff 0.4px, transparent 0.7px),
    radial-gradient(circle at 80% 60%, #7faaff 0.5px, transparent 0.8px);
  opacity: 0.6;
}

/* ========== 蛋糕光晕 ========== */
.cake-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(60,100,200,0.12) 0%, transparent 70%);
  pointer-events: none;
  animation: glowPulse 4s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.08); }
}

/* ========== 文字提示 ========== */
.message-box {
  margin-top: 120px;
  text-align: center;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.main-text {
  font-size: 36px;
  font-weight: 700;
  color: #c8d8ff;
  text-shadow: 0 0 30px rgba(100,160,255,0.6), 0 4px 10px rgba(0,0,0,0.4);
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.5s ease;
  letter-spacing: 4px;
}

.main-text.show {
  opacity: 1;
  transform: translateY(0);
}

.sub-text {
  font-size: 18px;
  color: rgba(170,196,255,0.75);
  opacity: 0;
  transition: opacity 0.5s ease 0.3s;
  letter-spacing: 2px;
}

.sub-text.show { opacity: 1; }

.hint-text {
  font-size: 15px;
  color: rgba(120,160,230,0.55);
  margin-top: 15px;
  opacity: 0;
  transition: opacity 0.5s ease 0.6s;
  animation: pulse 2s ease infinite;
  letter-spacing: 1px;
}

.hint-text.show { opacity: 1; }

@keyframes pulse {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 0.25; }
}

/* ========== 最终祝福 ========== */
#final-screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  z-index: 60;
  pointer-events: none;
}

#final-screen.show {
  opacity: 1;
  pointer-events: auto;
  transition: opacity 1.5s ease;
}

.final-content {
  text-align: center;
}

.happy-birthday {
  font-size: 72px;
  font-weight: 900;
  background: linear-gradient(to right, #4a90ff, #82b4ff, #c8d8ff, #82b4ff, #4a90ff);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
  white-space: nowrap;
  text-shadow: 0 0 60px rgba(80,140,255,0.3);
  letter-spacing: 8px;
}

.choice-name {
  font-size: 36px;
  font-weight: 600;
  color: #aac4ff;
  margin-bottom: 8px;
  letter-spacing: 4px;
  text-shadow: 0 0 30px rgba(100,150,255,0.4);
  padding-left: 30px;
}

@keyframes shine {
  to { background-position: 200% center; }
}

.final-wish {
  font-size: 24px;
  color: rgba(200,216,255,0.85);
  margin-top: 20px;
  letter-spacing: 3px;
}

.replay-btn {
  margin-top: 40px;
  padding: 12px 40px;
  font-size: 16px;
  border: 2px solid rgba(120,160,255,0.5);
  background: transparent;
  color: rgba(200,216,255,0.9);
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 3px;
}

.replay-btn:hover {
  background: rgba(80,140,255,0.15);
  border-color: #82b4ff;
  color: #fff;
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(80,140,255,0.3);
}

/* ========== 星尘上升 ========== */
.stardust {
  position: absolute;
  bottom: 0;
  border-radius: 50%;
  background: rgba(170,196,255,0.6);
  pointer-events: none;
  animation: stardustRise linear infinite;
  box-shadow: 0 0 4px rgba(120,160,255,0.4);
}

@keyframes stardustRise {
  to {
    transform: translateY(-110vh) translateX(var(--drift));
    opacity: 0;
  }
}

/* ========== 撒花（蓝白银星雨） ========== */
#confetti-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 55;
}

.confetti {
  position: absolute;
  top: -20px;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

/* 流星 */
.shooting-star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 6px #fff;
  pointer-events: none;
  animation: shootStar 1.5s ease-out forwards;
}

.shooting-star::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 80px;
  height: 1px;
  background: linear-gradient(to left, rgba(170,196,255,0.8), transparent);
  transform-origin: left center;
  transform: rotate(45deg);
}

@keyframes shootStar {
  0% { transform: translate(0, 0); opacity: 1; }
  100% { transform: translate(300px, 300px); opacity: 0; }
}

/* ========== 选择画面 ========== */
#choice-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 10vh;
  gap: 30px;
  opacity: 0;
  z-index: 60;
  pointer-events: none;
}
#choice-screen.show {
  opacity: 1;
  pointer-events: auto;
  transition: opacity 1s ease;
}
.choice-content { text-align: center; }
.choice-buttons {
  display: flex;
  gap: 40px;
  margin-top: 30px;
}
.choice-btn {
  padding: 16px 44px;
  font-size: 18px;
  letter-spacing: 3px;
  border: 2px solid rgba(120,160,255,0.4);
  background: rgba(20,40,100,0.3);
  color: #c8d8ff;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
  font-family: inherit;
}
.choice-btn:hover {
  background: rgba(60,120,220,0.2);
  border-color: #82b4ff;
  color: #fff;
  transform: scale(1.06);
  box-shadow: 0 0 30px rgba(80,140,255,0.3);
}

/* ========== 信封场景 ========== */
#letter-scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  z-index: 70;
  pointer-events: none;
  perspective: 1200px;
}
#letter-scene.show {
  opacity: 1;
  pointer-events: auto;
  transition: opacity 0.8s ease;
}

/* 信封——位于屏幕下半部 */
.envelope-wrapper {
  position: absolute;
  top: 60%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 460px;
  height: 300px;
  transition: all 0.8s ease;
}
.envelope-wrapper.hidden {
  opacity: 0;
  transform: translate(-50%, -50%) translateY(80px) scale(0.8);
  pointer-events: none;
}

/* 信封主体（星空蓝） */
.envelope-body {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #0a1a4a 0%, #0d1f55 35%, #051030 100%);
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(60,100,200,0.1);
  z-index: 3;
  overflow: hidden;
}
.envelope-body::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 10% 20%, #aac4ff 0.8px, transparent 1.2px),
    radial-gradient(circle at 30% 50%, #7faaff 0.6px, transparent 1px),
    radial-gradient(circle at 55% 30%, #fff 0.7px, transparent 1.1px),
    radial-gradient(circle at 75% 55%, #aac4ff 0.5px, transparent 0.9px),
    radial-gradient(circle at 90% 40%, #5e9eff 0.6px, transparent 1px),
    radial-gradient(circle at 20% 80%, #fff 0.5px, transparent 0.8px),
    radial-gradient(circle at 65% 85%, #7faaff 0.6px, transparent 1px);
  opacity: 0.7;
  pointer-events: none;
}

/* 信封翻盖（三角形） */
.envelope-flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 230px solid transparent;
  border-right: 230px solid transparent;
  border-top: 150px solid #15266a;
  z-index: 4;
  transform-origin: top center;
  transition: transform 0.9s cubic-bezier(0.4,0,0.2,1), z-index 0s 0.45s;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
.envelope-flap.open {
  transform: rotateX(180deg);
  z-index: 1;
  transition: transform 0.9s cubic-bezier(0.4,0,0.2,1), z-index 0s 0s;
}

/* 玫瑰蜡封 */
.wax-seal {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #e91e63 0%, #c2185b 40%, #880e4f 100%);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 0 18px rgba(200,30,80,0.35);
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.5s ease;
}
.wax-seal::after {
  content: '❤';
  color: rgba(255,200,210,0.85);
  font-size: 26px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
.wax-seal.broken {
  opacity: 0;
  transform: translateX(-50%) scale(0.2) rotate(40deg);
}

/* 信纸——直接居中显示 */
.letter-paper {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 420px;
  height: 520px;
  background: linear-gradient(to bottom, #f8f4ec 0%, #f0ead8 100%);
  border-radius: 4px;
  box-shadow: 0 5px 30px rgba(0,0,0,0.4);
  z-index: 10;
  opacity: 0;
  transform: translate(-50%, -50%) translateY(30px) scale(0.95);
  transition: all 1.2s cubic-bezier(0.34,1.2,0.64,1);
  overflow: hidden;
  padding: 20px;
}
.letter-paper.show {
  opacity: 1;
  transform: translate(-50%, -50%) translateY(0) scale(1);
}

.letter-svg {
  width: 100%;
  height: 100%;
}
.letter-svg text {

<script>
// ===== Web Audio 音乐引擎 =====
let audioCtx = null;
let masterGain = null;
let currentMusic = null;
let userVolume = 0.5; // 0~1，用户音量

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = userVolume;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function getMasterGain() {
  getAudioCtx();
  return masterGain;
}

// 用户音量设置（0静音 ~ 1最大）
function setUserVolume(v) {
  userVolume = v;
  if (masterGain) {
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(v, audioCtx.currentTime + 0.1);
  }
}

function stopMusic() {
  if (currentMusic) { currentMusic.stop(); currentMusic = null; }
  // 快速静音已调度的振荡器（100ms淡出），然后恢复用户音量
  if (masterGain) {
    const ctx = audioCtx;
    masterGain.gain.cancelScheduledValues(ctx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
    // 100ms后恢复用户音量，为新曲做准备
    masterGain.gain.setValueAtTime(0, ctx.currentTime + 0.12);
    masterGain.gain.linearRampToValueAtTime(userVolume, ctx.currentTime + 0.2);
  }
}

// 音符频率
const NOTE = {
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.0,A4:440.0,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.0,B5:987.77,
  C6:1046.5, R:0
};

// 通用：播放一个音符
function playNote(freq, start, dur, type='sine', vol=0.15) {
  if (freq === 0) return;
  const ctx = getAudioCtx();
  const mg = getMasterGain();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime + start);
  gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.02);
  gain.gain.linearRampToValueAtTime(vol * 0.7, ctx.currentTime + start + dur * 0.6);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
  osc.connect(gain).connect(mg);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + dur + 0.05);
}

// ===== 1. 生日快乐歌 =====
function playBirthdaySong() {
  stopMusic();
  const melody = [
    // [note, beats]
    [NOTE.C4,0.5],[NOTE.C4,0.5],[NOTE.D4,1],[NOTE.C4,1],[NOTE.F4,1],[NOTE.E4,2],
    [NOTE.C4,0.5],[NOTE.C4,0.5],[NOTE.D4,1],[NOTE.C4,1],[NOTE.G4,1],[NOTE.F4,2],
    [NOTE.C4,0.5],[NOTE.C4,0.5],[NOTE.C5,1],[NOTE.A4,1],[NOTE.F4,1],[NOTE.E4,1],[NOTE.D4,2],
    [NOTE.A4,0.5],[NOTE.A4,0.5],[NOTE.G4,1],[NOTE.F4,1],[NOTE.G4,1],[NOTE.F4,2],
  ];
  const bpm = 110, beat = 60 / bpm;
  let t = 0;
  let timerIDs = [];

  // 渐入：先静音 masterGain，再用3秒线性渐入到用户音量
  const ctx = getAudioCtx();
  const mg = getMasterGain();
  mg.gain.cancelScheduledValues(ctx.currentTime);
  mg.gain.setValueAtTime(0, ctx.currentTime);
  mg.gain.linearRampToValueAtTime(userVolume, ctx.currentTime + 3);

  const schedule = () => {
    melody.forEach(([n, b]) => {
      const id = setTimeout(() => playNote(n, 0, b * beat, 'triangle', 0.12), t * 1000);
      timerIDs.push(id);
      // 低八度和声
      const id2 = setTimeout(() => playNote(n / 2, 0, b * beat * 0.9, 'sine', 0.04), t * 1000);
      timerIDs.push(id2);
      t += b * beat;
    });
  };
  schedule();

  // 循环
  const loopId = setTimeout(() => playBirthdaySong(), (t + 0.5) * 1000);
  timerIDs.push(loopId);

  currentMusic = {
    stop() { timerIDs.forEach(id => clearTimeout(id)); }
  };
}

// ===== 2. 激情音乐（快节奏鼓点+合成器） =====
function playEpicMusic() {
  stopMusic();
  let stopped = false;
  let timerIDs = [];
  const ctx = getAudioCtx();
  const mg = getMasterGain();

  // 鼓点（低频脉冲）
  function kick(start) {
    const t = ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain).connect(mg);
    osc.start(t); osc.stop(t + 0.2);
  }

  // hi-hat（高频噪声）
  function hihat(start) {
    const t = ctx.currentTime + start;
    const buf = ctx.createBuffer(1, 2048, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < 2048; i++) d[i] = Math.random()*2-1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass'; filter.frequency.value = 7000;
    gain.gain.setValueAtTime(0.05, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    src.connect(filter).connect(gain).connect(mg);
    src.start(t); src.stop(t + 0.06);
  }

  const bassNotes = [55, 55, 82.41, 82.41, 73.42, 73.42, 65.41, 65.41];
  const leadNotes = [NOTE.A4, NOTE.C5, NOTE.E5, NOTE.A5, NOTE.G5, NOTE.E5, NOTE.D5, NOTE.C5];
  const beatLen = 0.5; // 120 BPM

  function loop() {
    if (stopped) return;
    for (let i = 0; i < 8; i++) kick(0.25 * i);
    for (let i = 0; i < 8; i++) playNote(bassNotes[i], i * 0.25, 0.3, 'sawtooth', 0.06);
    for (let i = 0; i < 8; i++) playNote(leadNotes[i], i * 0.25, 0.22, 'square', 0.04);
    for (let i = 0; i < 16; i++) hihat(i * 0.125);
    const id = setTimeout(loop, beatLen * 4 * 1000);
    timerIDs.push(id);
  }
  loop();

  currentMusic = { stop() { stopped = true; timerIDs.forEach(id => clearTimeout(id)); } };
}

// ===== 3. 浪漫音乐（钢琴琶音+弦乐） =====
function playRomanticMusic() {
  stopMusic();
  let stopped = false;
  let timerIDs = [];

  // C大调琶音 + F大调琶音交替 (I - IV - V - I)
  const chords = [
    [NOTE.C4, NOTE.E4, NOTE.G4, NOTE.C5], // C
    [NOTE.F4, NOTE.A4, NOTE.C5, NOTE.F5], // F
    [NOTE.G4, NOTE.B4, NOTE.D5, NOTE.G5], // G
    [NOTE.C4, NOTE.E4, NOTE.G4, NOTE.C5], // C
  ];
  const chordDur = 1.8; // 每个和弦1.8秒

  function playChord(chord, delay, sustain) {
    chord.forEach((n, i) => {
      const id = setTimeout(() => {
        // 钢琴音色（triangle + sine 叠加）
        playNote(n, 0, sustain, 'triangle', 0.08);
        playNote(n, 0, sustain, 'sine', 0.05);
        // 高八度装饰
        if (i === 0) playNote(n * 2, 0, sustain * 0.5, 'sine', 0.03);
      }, delay * 1000);
      timerIDs.push(id);
    });
  }

  function playSequence() {
    if (stopped) return;
    let t = 0;
    chords.forEach(chord => {
      playChord(chord, t, chordDur);
      // 琶音间隔
      chord.forEach((n, i) => {
        const id = setTimeout(() => playNote(n, 0, 0.3, 'triangle', 0.05), (t + i * 0.1) * 1000);
        timerIDs.push(id);
      });
      t += chordDur;
    });
    const loopId = setTimeout(playSequence, t * 1000);
    timerIDs.push(loopId);
  }
  playSequence();

  currentMusic = { stop() { stopped = true; timerIDs.forEach(id => clearTimeout(id)); } };
}

// ===== 状态机 =====
const steps = [
  { main: '点亮蜡烛', sub: '点燃属于你的那颗星', hint: '点击屏幕点亮蜡烛', interactive: 'light' },
  { main: '闭上眼睛', sub: '双手合十，在心中默念', hint: '', wait: 3000 },
  { main: '许个愿望吧', sub: '', hint: '', wait: 3500 },
  { main: '吹灭蜡烛', sub: '深吸一口气——呼！', hint: '点击屏幕或对着麦克风吹气', interactive: 'blow' },
];

let currentStep = -1;
let stepTimer = null;

// ===== 初始化星空背景 =====
function initStarfield() {
  const sf = document.getElementById('starfield');

  // 背景星星（大小不一）
  for (let i = 0; i < 120; i++) {

// ===== 水晶球内星点 =====
function initDomeStars() {
  const dome = document.querySelector('.crystal-dome');
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');

// ===== 倒计时 =====
function startCountdown() {
  const screen = document.getElementById('countdown-screen');

  let num = 3;
  const showNum = () => {
    if (num < 1) {
      screen.style.transition = 'opacity 0.5s';
      screen.style.opacity = '0';
      setTimeout(() => {
        screen.remove();
        showCakeScene();
      }, 500);
      return;
    }
    const el = document.createElement('div');
    el.className = 'count-number';
    el.textContent = num;
    screen.appendChild(el);
    setTimeout(() => el.remove(), 950);
    num--;
    setTimeout(showNum, 1000);
  };
  showNum();
}

// ===== 蛋糕细闪生成 =====
function spawnCakeSparkles() {
  const cake = document.querySelector('.cake');
  if (!cake) return;
  const tiers = cake.querySelectorAll('.cake-tier');
  tiers.forEach((tier) => {
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.className = 'cake-sparkle';

      s.style.animationDelay = (Math.random() * 3) + 's';
      // 随机微调颜色
      if (Math.random() > 0.5) {
        s.style.background = '#c8d8ff';
        s.style.boxShadow = '0 0 4px rgba(168,200,255,0.9), 0 0 8px rgba(100,150,255,0.5)';
      }
      tier.appendChild(s);
    }

}

// ===== 显示蛋糕 =====
function showCakeScene() {
  const scene = document.getElementById('cake-scene');
  scene.classList.add('show');
  spawnCakeSparkles();
  setTimeout(() => nextStep(), 1500);
}

// ===== 下一步 =====
function nextStep() {
  currentStep++;
  if (currentStep >= steps.length) return;

  const step = steps[currentStep];
  const mainEl = document.getElementById('main-text');
  const subEl = document.getElementById('sub-text');
  const hintEl = document.getElementById('hint-text');

  mainEl.classList.remove('show');
  subEl.classList.remove('show');
  hintEl.classList.remove('show');

  setTimeout(() => {
    mainEl.textContent = step.main;
    subEl.textContent = step.sub;
    hintEl.textContent = step.hint;

    mainEl.classList.add('show');
    subEl.classList.add('show');
    if (step.hint) hintEl.classList.add('show');

    if (step.interactive === 'light') {
      setupLightCandle();
    } else if (step.interactive === 'blow') {
      setupBlowCandle();
    } else if (step.wait) {
      stepTimer = setTimeout(() => nextStep(), step.wait);
    }
  }, 300);
}

// ===== 点亮单根蜡烛 =====
function setupLightCandle() {
  const flame = document.querySelector('.flame');

  document.body.onclick = function lightHandler(e) {
    if (flame.classList.contains('lit')) return;
    flame.classList.add('lit');
    createSparkle(e.clientX, e.clientY);
    playBirthdaySong(); // 柔和渐入播放生日快乐歌
    document.body.onclick = null;
    setTimeout(() => nextStep(), 1800);
  };
}

function createSparkle(x, y) {
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    const colors = ['#82b4ff', '#ffffff', '#aac4ff', '#c8d8ff'];
    s.style.cssText = `
      position: fixed; left: ${x}px; top: ${y}px;
      width: 6px; height: 6px; border-radius: 50%;
      background: ${colors[Math.floor(Math.random()*colors.length)]};
      pointer-events: none; z-index: 200;
      box-shadow: 0 0 8px #82b4ff;
    `;
    const angle = (Math.PI * 2 * i) / 12;
    const dist = 35 + Math.random() * 25;
    s.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }
    ], { duration: 700, easing: 'ease-out' });
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}

// ===== 吹灭蜡烛 =====
let blown = false;

function setupBlowCandle() {
  const flame = document.querySelector('.flame');
  const smoke = document.querySelector('.smoke');
  blown = false;

  function blowOut() {
    if (blown) return;
    blown = true;
    flame.classList.add('out');
    setTimeout(() => smoke.classList.add('rise'), 250);
    setTimeout(() => showFinal(), 2000);
  }

  document.body.onclick = function blowHandler(e) {
    if (micActive) return;
    blowOut();
  };

  try {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      micActive = true;
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);

      const data = new Uint8Array(analyser.frequencyBinCount);
      let blowDuration = 0;

      function detect() {
        if (blown) return;
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 2; i < 20; i++) sum += data[i];
        let avg = sum / 18;

        if (avg > 35) {
          blowDuration++;
          if (blowDuration > 4) {
            blowOut();
            stream.getTracks().forEach(t => t.stop());
            return;
          }
        } else {
          blowDuration = 0;
        }
        requestAnimationFrame(detect);
      }
      detect();
    }).catch(() => {});
  } catch(e) {}
}

// ===== 选择画面 =====
function showFinal() {
  startConfetti();
  startShootingStars();

  // 隐藏蛋糕阶段的提示文字（避免与按钮重叠）
  const msgBox = document.querySelector('.message-box');

  // 蛋糕缩小上移，文字和按钮在下方展开
  const cakeContainer = document.querySelector('.cake-container');
  if (cakeContainer) {
    cakeContainer.style.transition = 'transform 1s ease';
    cakeContainer.style.transform = 'scale(0.7) translateY(-80px)';
  }

  const choice = document.getElementById('choice-screen');
  setTimeout(() => {
    choice.classList.add('show');

}

// 互动模式：切激情音乐→跳转
function goInteractive() {

}

function goFishMode() {

// ===== 祝福信件 =====
function showLetter() {
  stopMusic();
  const choice = document.getElementById('choice-screen');
  choice.classList.remove('show');
  const scene = document.getElementById('letter-scene');
  setTimeout(() => {
    scene.classList.add('show');
    setTimeout(() => openEnvelope(), 1200);
  }, 500);
}

function openEnvelope() {
  const seal = document.querySelector('.wax-seal');
  const flap = document.querySelector('.envelope-flap');
  const wrapper = document.getElementById('envelope-wrapper');
  const letter = document.getElementById('letter-paper');

  seal.classList.add('broken');
  setTimeout(() => { flap.classList.add('open'); }, 450);
  // 信封淡出下沉
  setTimeout(() => {
    wrapper.classList.add('hidden');
  }, 1000);
  // 信纸居中淡入
  setTimeout(() => {
    letter.classList.add('show');
    setTimeout(() => writeLetter(), 800);
  }, 1400);
}

// ===== SVG 逐笔书写 =====
function writeLetter() {
  const container = document.getElementById('letter-svg-container');
  const SVGNS = 'http://www.w3.org/2000/svg';

  const lines = [
    { text: 'To. 张先生',           y: 50,  cls: 'ttl',  delay: 0    },
    { text: '张先生，生日快乐',       y: 90,  cls: 'bdy',  delay: 900  },
    { text: '祝你所愿皆所得',         y: 130, cls: 'bdy',  delay: 1800 },
    { text: '我很贪心',             y: 170, cls: 'bdy',  delay: 2700 },
    { text: '我想陪你吃早餐和晚餐',   y: 210, cls: 'bdy',  delay: 3600 },
    { text: '我想和你牵手散步',       y: 250, cls: 'bdy',  delay: 4500 },
    { text: '我想你心里只有我',       y: 290, cls: 'bdy',  delay: 5400 },
    { text: '我想跟你有以后',         y: 330, cls: 'bdy',  delay: 6300 },
    { text: '♥',                     y: 380, cls: 'heart', delay: 7200 },
  ];

  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', '0 0 400 500');
  svg.setAttribute('class', 'letter-svg');

  const defs = document.createElementNS(SVGNS, 'defs');

  lines.forEach((line, i) => {
    // clipPath
    const cp = document.createElementNS(SVGNS, 'clipPath');
    cp.setAttribute('id', `cp${i}`);
    const rect = document.createElementNS(SVGNS, 'rect');
    rect.setAttribute('x', '0');
    rect.setAttribute('y', String(line.y - 30));
    rect.setAttribute('width', '0');
    rect.setAttribute('height', '40');
    cp.appendChild(rect);
    defs.appendChild(cp);

    // text
    const text = document.createElementNS(SVGNS, 'text');
    text.setAttribute('x', '200');
    text.setAttribute('y', String(line.y));
    text.setAttribute('class', line.cls);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('clip-path', `url(#cp${i})`);
    text.textContent = line.text;
    svg.appendChild(text);
  });

  svg.insertBefore(defs, svg.firstChild);
  container.innerHTML = '';
  container.appendChild(svg);

  // 逐行动画 clipPath rect 宽度 0→400
  lines.forEach((line, i) => {
    const rect = svg.querySelector(`#cp${i} rect`);
    const duration = 1100;
    setTimeout(() => {
      const start = performance.now();
      function step(now) {
        const t = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3); // ease-out
        rect.setAttribute('width', String(Math.round(400 * eased)));
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }, line.delay);
  });

  // 所有动画结束后显示按钮
  const totalDelay = lines[lines.length - 1].delay + 1100 + 500;
  setTimeout(() => {
    const replayBar = document.getElementById('letter-replay');
    if (replayBar) replayBar.classList.add('show');
  }, totalDelay);
}

// ===== 重播信件书写 =====
function replayLetter() {
  const replayBar = document.getElementById('letter-replay');
  if (replayBar) replayBar.classList.remove('show');
  const letter = document.getElementById('letter-paper');
  letter.style.transition = 'opacity 0.5s';
  letter.style.opacity = '0';
  setTimeout(() => {
    letter.style.opacity = '';
    letter.classList.remove('show');
    void letter.offsetWidth; // reflow
    letter.classList.add('show');
    setTimeout(() => writeLetter(), 600);
  }, 600);
}

// ===== 返回选择画面 =====
function backToChoice() {
  const replayBar = document.getElementById('letter-replay');
  if (replayBar) replayBar.classList.remove('show');
  stopMusic();
  const scene = document.getElementById('letter-scene');
  scene.classList.remove('show');
  // 重置信件状态
  const seal = document.querySelector('.wax-seal');
  const flap = document.querySelector('.envelope-flap');
  const wrapper = document.getElementById('envelope-wrapper');
  const letter = document.getElementById('letter-paper');
  seal.classList.remove('broken');
  flap.classList.remove('open');
  wrapper.classList.remove('hidden');
  letter.classList.remove('show');
  letter.querySelector('#letter-svg-container').innerHTML = '';
  // 显示选择画面
  setTimeout(() => {
    const choice = document.getElementById('choice-screen');
    choice.classList.add('show');
  }, 500);
}

// ===== 撒花（蓝白银星雨） =====
function startConfetti() {
  const container = document.getElementById('confetti-container');
  const colors = ['#4a90ff', '#82b4ff', '#aac4ff', '#c8d8ff', '#ffffff', '#5e9eff', '#6ba6ff'];
  
  for (let i = 0; i < 100; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      const size = Math.random() * 8 + 4;
      c.style.left = Math.random() * 100 + '%';
      c.style.width = size + 'px';
      c.style.height = size + 'px';
      const color = colors[Math.floor(Math.random() * colors.length)];
      c.style.background = color;
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.boxShadow = `0 0 ${size}px ${color}`;
      c.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
      container.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }, i * 45);
  }
}

// ===== 流星 =====
function startShootingStars() {
  const container = document.getElementById('confetti-container');
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'shooting-star';
      s.style.left = Math.random() * 60 + '%';
      s.style.top = Math.random() * 40 + '%';
      container.appendChild(s);
      setTimeout(() => s.remove(), 1500);
    }, i * 600 + 300);
  }
}

// ===== 音量控件交互 =====
let prevVolume = 0.5;

function onVolChange(val) {
  const v = val / 100;
  setUserVolume(v);
  const control = document.getElementById('vol-control');
  const icon = document.getElementById('vol-icon');
  if (v === 0) {
    control.classList.add('muted');
  } else {
    control.classList.remove('muted');
    prevVolume = v;
  }
}

function toggleMute() {
  const slider = document.getElementById('vol-slider');
  const control = document.getElementById('vol-control');
  if (userVolume > 0) {
    prevVolume = userVolume;
    slider.value = 0;
    onVolChange(0);
  } else {
    const restore = Math.round(prevVolume * 100) || 50;
    slider.value = restore;
    onVolChange(restore);
  }
}

// ===== 启动 =====
initStarfield();
initDomeStars();

// 检查是否从子页面返回（直接跳到选择画面）

if (urlParams.get('skip') === 'choice') {
  // 跳过倒计时和蛋糕流程，直接显示选择画面
  const countdownScreen = document.getElementById('countdown-screen');
  if (countdownScreen) countdownScreen.remove();
  const cakeScene = document.getElementById('cake-scene');
  if (cakeScene) cakeScene.style.display = 'none';
  const msgBox = document.querySelector('.message-box');
  if (msgBox) msgBox.style.display = 'none';
  showFinal();
} else {
  startCountdown();
}
